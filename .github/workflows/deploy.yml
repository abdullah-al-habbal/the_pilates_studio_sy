name: Build and Deploy (Laravel via Git)

on:
  push:
    branches: [dev, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to Hostinger via Git
    runs-on: ubuntu-latest
    steps:
      - name: Determine target path and environment
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "TARGET=/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/pilatesstudiosy.com/public_html/production" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "COMPOSER_FLAGS=--no-dev --optimize-autoloader --no-interaction" >> $GITHUB_ENV
            echo "HEALTHCHECK_URL=https://pilatesstudiosy.com/api/v1/public/app-version" >> $GITHUB_ENV
          else
            echo "TARGET=/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/dev.pilatesstudiosy.com/public_html/dev" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "COMPOSER_FLAGS=--optimize-autoloader --no-interaction" >> $GITHUB_ENV
            echo "HEALTHCHECK_URL=https://dev.pilatesstudiosy.com/api/v1/public/app-version" >> $GITHUB_ENV
          fi

      - name: Check for fresh-migration flag
        id: check_fresh
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$HEAD_MSG" | grep -qF '[fresh-migrate]'; then
            echo "FRESH=true" >> $GITHUB_ENV
            echo "✅ Fresh migration flag detected"
          else
            echo "FRESH=false" >> $GITHUB_ENV
          fi

      - name: 🚀 Deploy via SSH (Git Pull & Build)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: FRESH
          timeout: 60s
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            TARGET="${{ env.TARGET }}"
            ENVIRONMENT="${{ env.ENVIRONMENT }}"
            COMPOSER_FLAGS="${{ env.COMPOSER_FLAGS }}"
            HEALTHCHECK_URL="${{ env.HEALTHCHECK_URL }}"
            DEPLOY_KEY="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/.ssh/pilates_deploy_key"
            
            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            PHP_BIN="$(command -v php8.4 || command -v php8.3 || command -v php || echo /usr/bin/php)"
            MIGRATE_LOCK="/tmp/laravel_migrate_$(echo "$TARGET" | tr '/' '_').lock"

            echo "🎯 Deploying to: $TARGET ($ENVIRONMENT)"
            cd "$TARGET"

            # ── PHASE 1: Storage preparation (Protect user uploads) ─────────
            mkdir -p storage/logs
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p storage/app/public

            if [ -d storage/app ]; then
              mv storage/app "storage/app.bak.$(date +%s)"
            fi

            # ── PHASE 2: Git Sync ───────────────────────────────────────────
            echo "📥 Fetching latest changes from Git..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "🧹 Cleaning untracked files (respects .gitignore)..."
            git clean -fd

            # Restore storage/app
            if ls storage/app.bak.* 1> /dev/null 2>&1; then
              for d in storage/app.bak.*; do
                rsync -a "$d"/ storage/app/
              done
              rm -rf storage/app.bak.*
            fi

            find storage bootstrap/cache -type d -exec chmod 775 {} \;
            find storage bootstrap/cache -type f -exec chmod 664 {} \;

            # Early cache clear: remove stale caches before dependency/migration phases
            # so a later phase failure can never leave a stale cache behind.
            # Guarded: if vendor is out of sync with a composer.json bump, artisan may
            # not boot yet — continue; composer install + phase 5 will fix and clear it.
            echo "🪣 Clearing stale caches (pre-build)..."
            $PHP_BIN artisan optimize:clear || echo "⚠️ Early clear failed — vendor may be stale, continuing"

            # ── Storage symlink (Hostinger disables exec(), artisan storage:link fails) ──
            rm -f public/storage
            ln -s ../storage/app/public public/storage
            echo "🔗 Storage symlink created: public/storage -> ../storage/app/public"

            # ── PHASE 3: Dependencies ───────────────────────────────────────
            echo "📦 Installing PHP dependencies..."
            composer install $COMPOSER_FLAGS

            echo "🏗️ Building frontend assets..."
            if command -v npm &> /dev/null; then
              npm ci
              npm run build
            else
              echo "⚠️ npm not found, skipping frontend build."
            fi

            # ── PHASE 4: Migrations ─────────────────────────────────────────
            echo "🗄️ Running migrations..."
            if [ "${FRESH}" = "true" ]; then
              echo "🔄 Fresh migration requested — dropping all tables and reseeding..."
              flock -n "$MIGRATE_LOCK" $PHP_BIN artisan migrate:fresh --seed --force
            else
              echo "Running standard migrations (locked)..."
              flock -n "$MIGRATE_LOCK" $PHP_BIN artisan migrate --force
            fi

            # ── PHASE 5: Cache & optimization ───────────────────────────────
            echo "🧹 Clearing and caching..."
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan view:cache

            echo "✅ Verifying application..."
            $PHP_BIN artisan about

            echo "🩺 Health check..."
            HTTP_CODE=$(curl -s -o /tmp/hc.json -w "%{http_code}" -X POST $HEALTHCHECK_URL \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'X-App-Name: customer' \
              -H 'X-App-Platform: android' \
              -H 'X-App-Version: 1.0.1' \
              -H 'X-Device-ID: deploy-healthcheck')
            if [ "$HTTP_CODE" != "200" ] || ! grep -q '"success":true' /tmp/hc.json; then
              echo "❌ HEALTH CHECK FAILED — HTTP $HTTP_CODE"
              cat /tmp/hc.json
              exit 1
            fi
            echo "✅ Health check passed"

            echo "🎉 Deployment to $ENVIRONMENT completed successfully"